{% set name = "pydicom" %}
{% set version = "3.0.2" %}

# AssertionError: Regex pattern did not match.
# Regex: "Error deepcopying the buffered element \\(7FE0,0010\\) 'Pixel Data': cannot (.*) '_io.BufferedReader' object"
# Input: "Error deepcopying the buffered element (7FE0,0010) 'Pixel Data': cannot pickle 'BufferedReader' instances"
{% set skip_test = "test_deepcopy_bufferedreader_raises " %}
# raise NotImplementedError("Non-relative patterns are unsupported")
# NotImplementedError: Non-relative patterns are unsupported
{% set skip_test = skip_test + "or test_no_absolute_path_in_get_testdata_file " %}  # [win]
{% set skip_test = skip_test + "or test_no_absolute_path_in_get_testdata_files " %} # [win]

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 76f95d03cba3e978dc19470c0907c6ad8ca68e72311137622e5fe5e8f594d67f

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -vv .
  entry_points:
    - pydicom = pydicom.cli.main:main

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2,<4
  run:
    - python

test:
  source_files:
    - pyproject.toml
    - tests
    - src
  imports:
    - src.pydicom
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert version('{{ name }}') == '{{ version }}'"
    - pydicom --help
    - pytest tests -k "not ({{ skip_test }})"

about:
  home: https://github.com/pydicom/pydicom
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Pure python package for DICOM medical file reading and writing
  description: |
    pydicom is a pure python package for parsing DICOM files. DICOM is a
    standard (https://dicomstandard.org) for communicating medical images and
    related information such as reports and radiotherapy objects.  pydicom
    makes it easy to read these complex files into natural pythonic structures
    for easy manipulation. Modified datasets can be written again to DICOM
    format files. See the `Getting Started
    <https://pydicom.github.io/pydicom/stable/>`_ page for
    installation and basic information, and the `Pydicom User Guide
  doc_url: https://pydicom.github.io/pydicom
  dev_url: https://github.com/pydicom/pydicom

extra:
  recipe-maintainers:
    - darcymason
    - glemaitre
    - arokem
